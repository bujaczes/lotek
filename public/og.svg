<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="LOTEK — obserwatorium Dużego Lotka">
  <defs>
    <radialGradient id="b" cx="38%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#fff6d1"/>
      <stop offset="42%" stop-color="#ffc400"/>
      <stop offset="100%" stop-color="#d99a00"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#fcfcfa"/>
  <rect x="0" y="0" width="1200" height="10" fill="#ffc400"/>

  <!-- a row of Lotto balls: the world of the object, not a dashboard -->
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="46" font-weight="600" fill="#191a2e" text-anchor="middle">
    <g transform="translate(190,150)">
