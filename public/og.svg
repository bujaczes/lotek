  <text x="100" y="400" font-family="'Bricolage Grotesque', system-ui, sans-serif" font-size="128" font-weight="700" fill="#191a2e" letter-spacing="-3">LOTEK</text>
  <text x="104" y="470" font-family="'Instrument Sans', system-ui, sans-serif" font-size="42" fill="#191a2e" opacity="0.72">Obserwatorium Dużego Lotka — 6 z 49</text>
  <text x="104" y="530" font-family="'Instrument Sans', system-ui, sans-serif" font-size="30" fill="#191a2e" opacity="0.5">Statystyki historyczne i uczciwy, deterministyczny Typer</text>
