      <text y="16">4</text>
    </g>
    <g transform="translate(350,150)">
      <circle r="62" fill="url(#b)" stroke="#d99a00" stroke-width="2"/>
      <ellipse cx="-16" cy="-22" rx="18" ry="10" fill="#fffbe9" opacity="0.7"/>
      <text y="16">16</text>
    </g>
    <g transform="translate(510,150)">
      <circle r="62" fill="url(#b)" stroke="#d99a00" stroke-width="2"/>
      <ellipse cx="-16" cy="-22" rx="18" ry="10" fill="#fffbe9" opacity="0.7"/>
      <text y="16">23</text>
    </g>
    <g transform="translate(670,150)">
      <circle r="62" fill="url(#b)" stroke="#d99a00" stroke-width="2"/>
      <ellipse cx="-16" cy="-22" rx="18" ry="10" fill="#fffbe9" opacity="0.7"/>
