<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LOTEK — obserwatorium Dużego Lotka: ostatnie losowanie, statystyki i uczciwy Typer. Projekt hobbystyczny do analizy danych publicznych." />
    <meta name="theme-color" content="#fcfcfa" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph / Twitter. og:image is an SVG (public/og.svg): self-contained and crisp,
         but note some social scrapers (Facebook/Twitter) prefer PNG/JPG and may skip SVG —
         a rasterized PNG would be the drop-in upgrade. These are static defaults; the SPA
         router refreshes og:title/description/url per route at runtime (src/meta.js). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LOTEK" />
    <meta property="og:title" content="LOTEK — obserwatorium Dużego Lotka" />
    <meta property="og:description" content="Ostatnie losowanie, statystyki historyczne i uczciwy, deterministyczny Typer. Projekt hobbystyczny do analizy danych publicznych." />
    <meta property="og:image" content="/og.svg" />
    <meta property="og:url" content="/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LOTEK — obserwatorium Dużego Lotka" />
    <meta name="twitter:description" content="Ostatnie losowanie, statystyki historyczne i uczciwy, deterministyczny Typer." />
    <meta name="twitter:image" content="/og.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>LOTEK</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
